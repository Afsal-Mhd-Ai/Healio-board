sleepQuality:{label:"Sleep quality",unit:"/5",min:1,max:5,step:1,band:[3,5],critical:[1,5],how:"Rate how restorative last sleep felt, 1 (poor) to 5 (restorative).",why:"Quality complements duration when assessing fatigue.",source:"Self-report; supportive screening"},

function field(k){let c=CONFIG.ranges[k],v=latest(k,simTime())?get(k,latest(k,simTime())):defaultsValue[k],slider=["mood","sleepQuality","isolation","conflict","workload","stress","exercise"].includes(k),title={hr:"Vitals & circulation",glucose:"Metabolic & environment",sleep:"Sleep & wellbeing",hydration:"Nutrition & body mass",exercise:"Countermeasure activity"}[k];return`${title?`<h3 class="form-section">${title}</h3>`:""}<div class="field"><label for="f-${k}">${esc(c.label)}</label>${slider?`<input id="f-${k}" name="${k}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}" oninput="document.getElementById('v-${k}').textContent=this.value"><span class="rangeval" id="v-${k}">${v} ${esc(c.unit)}</span>`:`<div class="input-wrap"><input id="f-${k}" name="${k}" type="number" min="${c.min}" max="${c.max}" step="any" value="${v}" aria-describedby="ref-${k}"><span>${esc(c.unit)}</span></div>`}<small>${esc(c.how)}</small><small class="range" id="ref-${k}">Configured reference band: ${c.band[0]}–${c.band[1]} ${esc(c.unit)} · ${esc(c.source)}</small></div>`}
function behaviorTrend(){let a=state.behavior.slice(-5).reverse();return a.length?`<div class="list">${a.map(x=>`<div class="item fine">${new Date(x.t).toLocaleDateString()} · Mood ${x.mood}/5 · Sleep ${x.sleepQuality}/5 · Isolation ${x.isolation}/5 · Workload ${x.workload}/5${x.note?`<p>${state.privacy?esc(x.note):"Private note hidden by local preference."}</p>`:""}</div>`).join("")}</div>`:`<p class="muted fine">No behavioral check-ins yet.</p>`}
function checkinView(){return`<div class="section"><div class="eyebrow">Private on this device · no judgment</div><h1>Daily check-in</h1><p class="muted">Record what you know. Missing readings are okay. Use approved equipment and follow your mission-specific plan.</p></div><div class="grid g2"><section class="card"><div class="form-heading"><div><h2>Health indicators</h2><p class="fine muted">Use current approved measurements; you can leave any field unchanged.</p></div><button class="tertiary" type="button" onclick="openWizard()">Guided measurement</button></div><form id="checkForm"><div class="formgrid">${CONFIG.indicators.map(field).join("")}</div><div class="form-actions"><button class="primary">Save measurements</button></div></form></section><section class="card"><div class="form-heading"><div><h2>Behavioral wellbeing</h2><p class="fine muted">Optional self-report; not a psychological assessment or diagnosis.</p></div></div><form id="behaviorForm"><div class="formgrid"><h3 class="form-section">Personal wellbeing</h3>${["mood","sleepQuality"].map(field).join("")}<h3 class="form-section">Crew and workload context</h3>${["isolation","conflict","workload"].map(field).join("")}</div><div class="field"><label for="note">Private note <span class="muted">(optional)</span></label><textarea id="note" rows="3" maxlength="500" placeholder="Anything you want to remember…"></textarea><small>Stored only on this device.</small></div><div class="form-actions"><button class="primary">Save check-in</button></div></form><h3 class="subheading">Recent check-ins</h3>${behaviorTrend()}<p class="fine muted">If distress persists, worsens, affects safe work, or you feel unsafe, tell crew and follow mission procedures.</p></section></div>`}
function coachView(){let mins=state.exercise.filter(x=>new Date(x.t).toDateString()===new Date().toDateString()).reduce((s,x)=>s+x.minutes,0);return`<div class="section"><div class="eyebrow">Prescribed countermeasures only</div><h1>Countermeasure coach</h1></div><div class="grid g2"><section class="card"><h2>Exercise log</h2><p>Log aerobic and resistive work. Follow your mission prescription; this tracker does not prescribe a dose.</p><div class="metric">${mins} <small class="fine muted">min today</small></div><progress class="bar-progress" max="60" value="${Math.min(60,mins)}" aria-label="${mins} exercise minutes today; 60-minute illustrative reference"></progress><p class="fine muted">Illustrative bone-loading tracker: ${Math.min(100,Math.round(mins/60*100))}% of a 60-minute demo reference, not a requirement.</p><form id="exerciseForm" class="wrap"><div class="field"><label for="exMinutes">Minutes</label><input id="exMinutes" type="number" min="1" max="240" value="30"></div><div class="field"><label for="exType">Type</label><select id="exType"><option>Aerobic</option><option>Resistive</option><option>Combined</option></select></div><button class="primary">Log session</button></form></section><section class="card"><h2>Daily care cues</h2><div class="list">${[["Hydration","Use your personal fluid plan; log intake and follow restrictions."],["Nutrition","Log menu intake. Report persistent appetite changes or unintentional mass trends."],["Sleep","Protect scheduled sleep opportunity; report sustained disruption."],["Radiation event","Follow alert instructions and move to designated shelter. Use mission procedures."]].map(x=>`<div class="item"><b>${x[0]}</b><p class="fine">${x[1]}</p></div>`).join("")}</div><h3>Wellbeing support</h3><p>If distress persists or you feel unsafe, tell crew and use mission procedures. These suggestions are not treatment.</p></section></div>`}
function answer(q){let s=q.toLowerCase(),a=alerts(simTime());if(/fever|urgent|pain|chest|breath|faint|emergency|unsafe/.test(s))return"<b>Urgent symptoms:</b> This tool cannot assess you. Notify crew and follow mission emergency procedures now; do not wait for remote reply.";if(/radiat|solar|shelter/.test(s))return`<b>Radiation:</b> Follow mission alert and designated shelter procedure; record dosimeter readings and tell crew. The app cannot determine exposure safety. Logged dose: ${fmt(get("radiation",latest("radiation",simTime())))} mSv.`;if(/sleep|tired|fatigue/.test(s))return`<b>Sleep:</b> Protect planned sleep opportunity and follow mission routine. Logged duration: ${fmt(get("sleep",latest("sleep",simTime())))} h. Report persistent disruption to crew/support.`;if(/mood|stress|isolation|conflict|workload|lonely/.test(s))return`<b>Wellbeing:</b> Consider a private crew check-in or scheduled support. This is not a diagnosis. If you feel unsafe, tell crew and use emergency procedures. Current mood: ${fmt(get("mood",latest("mood",simTime())),0)}/5.`;if(/exercise|bone|muscle|gravity/.test(s))return`<b>Exercise:</b> Follow your prescribed countermeasures; do not change the prescription based on this app. Logged exercise: ${fmt(get("exercise",latest("exercise",simTime())),0)} min/day.`;if(/glucose|sugar|nutrition|hydration|water/.test(s))return"<b>Nutrition / glucose:</b> Use approved measurement tools and your personal care plan. Repeat unexpected readings per device instructions and notify crew for concerning or persistent results.";if(/baseline|trend|status|score|data/.test(s))return`<b>Logged status:</b> Demo score ${score()}/100. ${a.length?"Current flags: "+a.map(x=>CONFIG.ranges[x.key].label+" ("+x.level+")").join(", "):"No current rule-based flags."} Not clinical advice.`;return"I answer only built-in topics: radiation shelter, sleep routine, wellbeing, prescribed exercise, nutrition/hydration, urgent escalation, and logged trends. For personal medical decisions, contact crew/flight surgeon."}
function ask(q){document.getElementById("answer").innerHTML=`<div class="item">${answer(q)}</div><p class="fine muted">Offline knowledge base only · not a medical device</p>`}
function askView(){let groups={"Radiation & environment":[["radiation","Radiation event shelter steps"],["fever","Temperature reading and crew escalation"],["spo2","Oxygen saturation recheck"]],"Sleep & wellbeing":[["sleep","Sleep disruption support"],["mood","Mood and isolation support"],["stress","Stress and workload support"]],"Countermeasures & nutrition":[["exercise","Prescribed exercise guidance"],["glucose","Glucose, nutrition, and hydration"]],"My logged data":[["baseline","Personal baseline and current flags"],["status","Current status summary"]]};return`<div class="section"><div class="eyebrow">Offline knowledge base · structured guidance only</div><h1>Ask Doc</h1><p class="muted">Choose a topic. Responses use built-in general information and current logged data; they cannot diagnose, prescribe, or clear crew members for duty.</p></div><div class="grid g2"><section class="card"><h2>Topics</h2>${Object.entries(groups).map(([group,items])=>`<section class="item section"><h3>${group}</h3><div class="wrap">${items.map(([key,label])=>`<button class="small" onclick="ask('${key}')">${label}</button>`).join("")}</div></section>`).join("")}<div id="answer" class="section" aria-live="polite"></div></section><section class="card"><h2>Safety boundary</h2><p>Urgent or worsening symptoms? Notify crew and follow mission protocol now. Mars transit demo delay is up to 22 minutes one way; do not wait when local procedures call for action.</p><p>This prototype does not transmit or contact anyone. For personalized medical guidance, use the mission medical channel.</p><p class="fine muted">Decision-support prototype, not a medical device.</p></section></div>`}
function handoff(){let t=simTime(),since=t-7*864e5,a=alerts(t),rs=state.records.filter(r=>r.t>=since&&r.t<=t),out=["ORBITAL — 7-day health handoff","Generated: "+new Date(t).toLocaleString(),"Mission day "+(state.sim?state.simDay+1:missionDay())+" · Environment: "+CONFIG.modes[state.mode].label,"Decision-support prototype; not a medical device.","","ALERTS:"];if(!a.length)out.push("- No current rule-based alerts.");a.forEach(x=>out.push(`- ${CONFIG.ranges[x.key].label}: ${x.level}; ${x.what} Action: ${x.action}`));out.push("","RECENT INDICATORS:");CONFIG.indicators.forEach(k=>{let x=rs.map(r=>get(k,r)).filter(Number.isFinite);if(x.length)out.push(`- ${CONFIG.ranges[k].label}: latest ${fmt(x.at(-1))} ${CONFIG.ranges[k].unit}; 7-day mean ${fmt(mean(x))}; n=${x.length}`)});out.push("","ACTIONS:");state.actions.filter(x=>x.t>=since&&x.t<=t).forEach(x=>out.push("- "+new Date(x.t).toLocaleString()+": "+x.text));out.push("","Verify readings, symptoms, context, and mission protocol with crew/flight surgeon.");return out.join("\n")}
function handoffView(){return`<div class="section"><div class="eyebrow">Secure local preview · queued for later sync</div><h1>Flight surgeon handoff</h1><p class="muted">This file never transmits data. Queued means locally marked for sync, not sent.</p></div><div class="grid g2"><section class="card"><h2>7-day summary</h2><div class="wrap"><button class="primary" onclick="copyHandoff()">Copy plain text</button><button onclick="window.print()">Print handoff</button><button onclick="queueHandoff()">Queue for sync</button></div><pre class="item">${esc(handoff())}</pre></section><section class="card"><h2>Sync queue</h2><p><b>${state.queued.length} item(s) queued locally</b></p><div class="list">${state.queued.map(x=>`<div class="item fine">Queued ${new Date(x.t).toLocaleString()} · ${esc(x.status)}</div>`).join("")||"Nothing queued."}</div><p class="fine muted">No server exists. Queue stays on this device.</p><button class="small danger" onclick="state.queued=[];save();render()">Clear local queue</button></section></div>`}
function missionView(){let notes={iss:"Crewed low Earth orbit operations; communication with ground is typically available per mission schedule.",orion:"Deep-space transit context with greater distance and communication delay.",lunar:"Lunar surface operations in partial gravity; local procedures remain authoritative.",mars:"Synthetic Mars transit scenario with a 22-minute illustrative one-way communication delay.",surface:"Synthetic Mars surface scenario in partial gravity; environment emphasis is illustrative."};return`<div class="section"><div class="eyebrow">Mission context and demo controls</div><h1>Mission / simulator</h1><p class="muted">Mode changes hazard emphasis and simulated communication delay; data is synthetic and labeled.</p></div><div class="grid g2"><section class="card"><h2>Mission environment</h2><div class="field"><label for="mode">Mode</label><select id="mode" onchange="state.mode=this.value;save();render()">${Object.entries(CONFIG.modes).map(([k,x])=>`<option value="${k}" ${state.mode===k?"selected":""}>${esc(x.label)}</option>`).join("")}</select></div><p>${esc(notes[state.mode])}</p><p>Hazard emphasis: ${Object.entries(CONFIG.modes[state.mode].weights).map(([h,v])=>`${CONFIG.hazards[h].label} ×${v}`).join(" · ")}</p><p>Simulated one-way delay: ~${CONFIG.modes[state.mode].delay} min. Illustrative only.</p><button class="primary" onclick="contact()">Prepare flight surgeon handoff</button><p class="fine muted">Local preview only; no transmission.</p></section><section class="card"><h2>180-day demo simulator</h2>${state.sim?`<div class="item"><b>SYNTHETIC SCENARIO</b> · Mission day ${state.simDay+1} of 180</div>`:"<p>Scenarios include radiation event, sleep disruption, exercise gap, glucose drift, and mood dip.</p>"}<div class="field"><label for="timeSlider">Timeline scrubber · day <span id="dayLabel">${state.simDay+1}</span></label><input id="timeSlider" type="range" min="0" max="179" value="${state.simDay}" oninput="state.simDay=+this.value;updateSimLabel()"></div><div class="wrap"><button class="primary" onclick="toggleSim()">${state.simPlaying?"Pause":"Play"} ×${state.simSpeed}</button><select aria-label="Simulation speed" onchange="state.simSpeed=+this.value"><option value="4" ${state.simSpeed===4?"selected":""}>×4</option><option value="16" ${state.simSpeed===16?"selected":""}>×16</option><option value="40" ${state.simSpeed===40?"selected":""}>×40</option></select><button onclick="loadDemo()">Load 180-day scenario</button><button class="danger" onclick="resetDemo()">Reset scenario</button><button onclick="enterOwn()">Enter crew data</button></div><div class="wrap section">${[["radiation","Radiation spike"],["fever","Fever"],["sleep","Missed sleep"],["glucose","Glucose drift"]].map(x=>`<button class="small" onclick="inject('${x[0]}')">Inject scenario · ${x[1]}</button>`).join("")}</div><p class="fine muted">Timeline changes the context used by trends and alerts. Event markers and values are synthetic.</p></section></div><section class="card section"><h2>Hazard emphasis by mode</h2><div class="wrap">${Object.entries(CONFIG.hazards).map(([k,h])=>`<span class="pill">${esc(h.label)} · ×${CONFIG.modes[state.mode].weights[k]}</span>`).join("")}</div><p class="fine">Demo threshold boundaries remain visible and are not clinical limits.</p></section>`}
function sourcesView(){return`<div class="section"><div class="eyebrow">Transparent methods · offline references</div><h1>Sources & thresholds</h1><p class="muted">Thresholds are editable in CONFIG. Demo-calibrated values are examples, not recommendations. NASA publications do not establish this app's cutoffs.</p></div><div class="grid g2"><section class="card"><h2>NASA / public resources</h2><ul><li><a href="https://www.nasa.gov/hrp/" target="_blank" rel="noreferrer">NASA Human Research Program (HRP)</a> — hazards and human-system risks.</li><li><a href="https://standards.nasa.gov/standard/nasa/nasa-std-3001-vol-1" target="_blank" rel="noreferrer">NASA-STD-3001</a> — spaceflight human-system standard; verify current volume/revision.</li><li><a href="https://www.nasa.gov/humans-in-space/" target="_blank" rel="noreferrer">NASA Humans in Space</a>.</li><li><a href="https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration" target="_blank" rel="noreferrer">ESA Human and Robotic Exploration</a>.</li><li><a href="https://humans-in-space.jaxa.jp/en/" target="_blank" rel="noreferrer">JAXA Humans in Space</a>.</li><li><a href="https://www.asc-csa.gc.ca/eng/astronomy/astronauts/" target="_blank" rel="noreferrer">Canadian Space Agency astronauts</a>.</li></ul><p class="fine muted">Links need internet; this product itself makes no network requests.</p></section><section class="card"><h2>Threshold provenance</h2><p>Every indicator form and matrix row shows a source note. Thresholds live in <code>CONFIG.ranges</code>. Most are demo-calibrated; not for diagnosis, triage, or fitness-for-duty decisions.</p><p>Personal comparison uses rolling 7-day and mission-start means. Risk rules are transparent associations, not causal inference. Forecast uses a short linear projection; uncertainty is high.</p><p><b>Persistent disclaimer:</b> ${esc(CONFIG.app.disclaimer)}</p></section></div><section class="card section"><h2>Hazard-to-indicator matrix</h2>${matrix()}</section>`}
function settingsView(){return`<div class="section"><div class="eyebrow">Local controls · configurable demonstration rules</div><h1>Settings</h1><p class="muted">Thresholds shown here are prototype defaults, not clinical or mission-approved limits. Edit only for demonstration; consult qualified medical personnel for operational criteria.</p></div>
<section class="card"><div class="row"><div><h2>Threshold editor</h2><p class="fine muted">Current values are applied to rule evaluation. Original demo defaults are shown for comparison.</p></div><button class="small" onclick="resetThresholds()">Restore demo defaults</button></div><form id="thresholdForm"><div class="threshold-table"><table class="table"><thead><tr><th>Indicator</th><th>Band low</th><th>Band high</th><th>Critical low</th><th>Critical high</th><th>Unit · source</th><th>Original demo defaults</th></tr></thead><tbody>${CONFIG.indicators.map(k=>{let r=CONFIG.ranges[k],d=DEFAULT_THRESHOLDS[k];return`<tr><th>${esc(r.label)}</th>${["b0","b1","c0","c1"].map((x,i)=>`<td><label class="sr-only" for="th-${k}-${x}">${esc(r.label)} ${["band lower","band upper","critical lower","critical upper"][i]}</label><input id="th-${k}-${x}" name="${k}-${x}" type="number" step="${r.step}" value="${i<2?r.band[i]:r.critical[i-2]}"></td>`).join("")}<td>${esc(r.unit)}<br><small>${esc(r.source)}</small></td><td><small>Band ${d.band[0]}–${d.band[1]}<br>Critical ${d.critical[0]}–${d.critical[1]}</small></td></tr>`}).join("")}</tbody></table></div><button class="primary" type="submit">Save threshold settings</button></form></section>
<div class="grid g2 section"><section class="card"><h2>Data management</h2><p>Readings and notes are stored in this browser profile. Export a JSON copy for your own records or clear local measurements.</p><div class="wrap"><button onclick="exportData()">Export local data</button><button class="danger" onclick="confirmClearData()">Clear measurements…</button></div><p class="fine muted">${persistOK?"Local persistence active":"Storage unavailable; this session is memory-only"}. No data is sent to any service.</p></section><section class="card"><h2>Privacy</h2><p>Local browser storage is not encrypted by this prototype and may be visible to others with access to the profile.</p><label><input type="checkbox" ${state.privacy?"checked":""} onchange="state.privacy=this.checked;save();render()"> Show private check-in notes in this browser</label><p class="fine muted">Turning this off hides notes in the check-in history; it does not erase stored notes or provide access control.</p></section></div>`}

function render(){document.body.classList.toggle("light-theme",state.theme==="light");document.body.classList.toggle("nav-collapsed",!!state.navCollapsed);let nav=tabs.map(x=>`<button title="${x}" class="${state.activeTab===x?"active":""}" aria-current="${state.activeTab===x?"page":"false"}" onclick="go('${x}')"><span class="nav-icon">${tabIcon(x)}</span><span class="nav-label">${x}</span></button>`).join("");document.getElementById("app").innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="logo" aria-hidden="true">◉</div><div><b>ORBITAL</b><div class="tag">Know your signal.</div></div></div><div class="right"><div class="field"><label class="hide" for="headerMode">Mission mode</label><select id="headerMode" aria-label="Mission mode" onchange="state.mode=this.value;save();render()">${Object.entries(CONFIG.modes).map(([k,x])=>`<option value="${k}" ${state.mode===k?"selected":""}>${esc(x.label)}</option>`).join("")}</select></div><button class="small" onclick="state.theme=state.theme==='dark'?'light':'dark';save();render()" aria-label="Toggle theme">${state.theme==="dark"?"☼":"☾"}</button><button class="small" onclick="openWizard()">Guided measure</button></div></header><div class="app-layout"><nav class="nav" aria-label="Main navigation">${nav}<button class="nav-collapse" onclick="state.navCollapsed=!state.navCollapsed;save();render()" aria-label="${state.navCollapsed?"Expand":"Collapse"} navigation"><span class="nav-icon" aria-hidden="true">↔</span><span class="collapse-label">${state.navCollapsed?"Expand":"Collapse"} navigation</span></button><button id="moreBtn" onclick="moreNav()" aria-label="More navigation options"><span class="nav-icon" aria-hidden="true">···</span><span class="nav-label">More</span></button></nav><div class="main-area"><main class="page-enter">${view()}</main><footer class="footer"><b>Not a medical device.</b> ${esc(CONFIG.app.disclaimer)} · Offline-first${persistOK?"":" · Memory-only"} · <a href="#" onclick="go('Sources');return false">Sources & methodology</a></footer></div></div></div>`;if(state.activeTab==="Mission"){let slider=document.getElementById("timeSlider");if(slider&&slider.insertAdjacentHTML)slider.insertAdjacentHTML("afterend",eventTimeline());let play=document.querySelector('button[onclick="toggleSim()"]');if(play){play.parentElement.classList.add("sim-controls");play.classList.add("play-control")}}wire()}
function moreNav(){showModal(`<div class="row"><h2>Mission tools</h2><button class="small" onclick="closeModal()">Close</button></div><div class="list">${tabs.slice(5).map(x=>`<button onclick="closeModal();go('${x}')"><span class="nav-icon">${tabIcon(x)}</span> ${x}</button>`).join("")}</div>`)}
function go(t){state.activeTab=t;save();render();scrollTo(0,0)}
function saveThresholds(fd){let updates={};for(const k of CONFIG.indicators){let v=["b0","b1","c0","c1"].map(s=>Number(fd.get(`${k}-${s}`)));if(v.some(n=>!Number.isFinite(n))||v[0]>v[1]||v[2]>v[0]||v[3]<v[1])throw Error(`Check ranges for ${CONFIG.ranges[k].label}; critical boundaries must contain the reference band.`);updates[k]={band:v.slice(0,2),critical:v.slice(2)}}for(const[k,v]of Object.entries(updates))Object.assign(CONFIG.ranges[k],v);state.thresholdOverrides=updates;save();render();toast("Demo threshold settings saved locally.")}
function resetThresholds(){state.thresholdOverrides={};for(const[k,v]of Object.entries(DEFAULT_THRESHOLDS))Object.assign(CONFIG.ranges[k],{band:[...v.band],critical:[...v.critical]});save();render();toast("Demo defaults restored.")}
function exportData(){try{let blob=new Blob([JSON.stringify({product:"ORBITAL",exportedAt:new Date().toISOString(),disclaimer:CONFIG.app.disclaimer,data:{records:state.records,behavior:state.behavior,exercise:state.exercise,actions:state.actions,queued:state.queued}},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`orbital-local-export-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast("Local data export prepared.")}catch(e){console.error("Data export failed.",e);toast("Could not export data. Check browser download permissions.")}}
function confirmClearData(){showModal(`<div class="row"><h2>Clear local measurements?</h2><button class="small" onclick="closeModal()">Cancel</button></div><p>This permanently removes locally stored measurements, wellbeing notes, exercise logs, actions, and queued handoffs from this browser profile. Threshold configuration and appearance preferences remain.</p><div class="wrap"><button onclick="closeModal()">Keep data</button><button class="danger" onclick="clearData()">Clear local data</button></div>`)}
function clearData(){state.records=[];state.behavior=[];state.exercise=[];state.actions=[];state.queued=[];state.routine={};state.snoozedUntil={};state.streak=0;state.lastCheckDay="";state.xp=0;state.badges=[];save();closeModal();go("Home");toast("Local measurement data cleared.")}
function wire(){let f=document.getElementById("thresholdForm");if(f)f.onsubmit=e=>{e.preventDefault();try{saveThresholds(new FormData(e.currentTarget))}catch(x){toast(x.message)}};
f=document.getElementById("checkForm");if(f)f.onsubmit=e=>{e.preventDefault();let fd=new FormData(e.currentTarget),v={};CONFIG.indicators.forEach(k=>{if(fd.get(k)!=="")v[k]=Number(fd.get(k))});try{record(v,simTime());CONFIG.schedules.forEach(s=>{if(s.items.some(k=>k in v))state.routine[s.name]=now()});save();go("Home");toast("Measurements saved locally.")}catch(x){toast(x.message)}};
f=document.getElementById("behaviorForm");if(f)f.onsubmit=e=>{e.preventDefault();let fd=new FormData(e.currentTarget),b={t:simTime(),note:document.getElementById("note").value.trim()};["mood","sleepQuality","isolation","conflict","workload"].forEach(k=>b[k]=Number(fd.get(k)));state.behavior.push(b);record({mood:b.mood,sleep:b.sleepQuality,stress:clamp(b.workload*2,0,10)},simTime(),"behavior check-in");state.actions.push({t:simTime(),text:"Completed wellbeing check-in"});save();render();toast("Check-in saved privately.")};
f=document.getElementById("exerciseForm");if(f)f.onsubmit=e=>{e.preventDefault();let n=Number(document.getElementById("exMinutes").value),type=document.getElementById("exType").value;if(!Number.isFinite(n)||n<1||n>240){toast("Enter exercise minutes from 1 to 240.");return}state.exercise.push({t:simTime(),minutes:n,type});record({exercise:n},simTime(),"exercise log");state.actions.push({t:simTime(),text:`Logged ${n} minutes ${type.toLowerCase()} exercise`});save();render();toast("Exercise session logged.")};
}
function showModal(html){let m=document.getElementById("modal");m.innerHTML=`<div class="modalbox">${html}</div>`;m.classList.remove("hide");m.querySelector("button")?.focus()}function closeModal(){document.getElementById("modal").classList.add("hide")}document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function openWizard(){state.wizStep=0;state.wizKeys=CONFIG.indicators;state.wizValues={};wizard()}
function wizard(){let k=state.wizKeys[state.wizStep],r=CONFIG.ranges[k],s=state.wizStep+1,n=state.wizKeys.length;showModal(`<div class="row"><div><div class="eyebrow">Guided measurement · ${s} of ${n}</div><h2>${esc(r.label)}</h2></div><button class="small" onclick="closeModal()">Exit</button></div><svg class="wizard-art" viewBox="0 0 500 110" role="img" aria-label="Illustration of the measurement sequence"><title>Measure, pause, and record</title><rect x="18" y="18" width="464" height="74" rx="14" fill="#142437" stroke="#38536b"/><circle cx="70" cy="55" r="22" fill="#245443" stroke="#56d6c3"/><text x="70" y="62" text-anchor="middle" fill="white" font-size="22">${s}</text><path d="M125 54h240m-12-9 12 9-12 9" stroke="#56d6c3" stroke-width="3" fill="none"/><rect x="395" y="35" width="52" height="40" rx="6" fill="#274056" stroke="#77b7ff"/><text x="421" y="60" text-anchor="middle" fill="white" font-size="12">READ</text></svg><p><b>How to measure:</b> ${esc(r.how)}</p><p><b>Why it matters in microgravity:</b> ${esc(r.why)}</p><div class="field"><label for="wizValue">Measurement (${esc(r.unit)})</label><input id="wizValue" type="number" min="${r.min}" max="${r.max}" step="${r.step}" value="${state.wizValues[k]??""}"></div><p class="fine muted">Configured reference ${r.band[0]}–${r.band[1]} ${esc(r.unit)} · ${esc(r.source)}. Repeat unexpected values per device instructions.</p><div class="row"><button ${s===1?"disabled":""} onclick="wizardPrev()">Back</button><span class="muted">Step ${s}/${n}</span><button class="primary" onclick="wizardNext()">${s===n?"Save measurement":"Next"}</button></div>`)}
function wizardPrev(){state.wizStep--;wizard()}function wizardNext(){let k=state.wizKeys[state.wizStep],v=document.getElementById("wizValue").value;if(v!==""&&!Number.isFinite(Number(v))){toast("Enter a numeric measurement.");return}if(v!=="")state.wizValues[k]=Number(v);if(state.wizStep<state.wizKeys.length-1){state.wizStep++;wizard();return}if(Object.keys(state.wizValues).length)record(state.wizValues,simTime(),"guided wizard");closeModal();go("Home");toast("Guided measurements saved.")}
function handoffCopy(){return handoff()}function copyHandoff(){let t=handoffCopy();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("Summary copied."),()=>fallbackCopy(t));else fallbackCopy(t)}function fallbackCopy(t){let x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast("Summary copied.")}catch(e){toast("Copy unavailable. Select and copy the summary manually.")}x.remove()}
function queueHandoff(){state.queued.push({t:simTime(),status:"Queued locally — not transmitted"});save();render();toast("Summary queued locally.")}function contact(){let d=CONFIG.modes[state.mode].delay;showModal(`<div class="row"><h2>Flight surgeon handoff</h2><button class="small" onclick="closeModal()">Close</button></div><div class="item"><b>Simulated one-way comm delay: ~${d} minutes.</b><p>Local preview only. This prototype does not transmit or contact anyone. For urgent concerns, notify crew and follow protocol now.</p></div><pre>${esc(handoff())}</pre><div class="wrap"><button class="primary" onclick="queueHandoff();closeModal()">Queue summary locally</button><button onclick="copyHandoff()">Copy</button></div>`)}
function simValues(d){let v={hr:66,sys:116,dia:74,glucose:96,temp:36.7,spo2:98,sleep:7.6,mood:4,stress:3,hydration:2.4,exercise:55,radiation:d*.48,weight:75,calories:2400};for(let k in v)if(k!=="radiation")v[k]+=Math.sin(d*.71+k.length)*({hr:4,sys:3,dia:2,glucose:7,temp:.15,spo2:1,sleep:.7,mood:.4,stress:1,hydration:.4,exercise:15,weight:.4,calories:180}[k]);if(d>=72&&d<=74)v.radiation+=260;if(d>=91&&d<=98)v.sleep-=3.5;if(d>=119&&d<=130)v.exercise-=45;if(d>=132)v.glucose+=(d-131)*.65;if(d>=145&&d<=157)v.mood-=1.7;return v}
function loadDemo(){let start=now()-179*864e5;state.records=state.records.filter(r=>r.source!=="simulator"&&r.source!=="injected event");for(let d=0;d<180;d++)state.records.push({id:"sim"+d,t:start+d*864e5+12*36e5,values:simValues(d),source:"simulator"});state.records.sort((a,b)=>a.t-b.t);state.missionStart=start;state.sim=true;state.simDay=179;state.mode="mars";save();render();toast("180-day Mars-transit simulation loaded.")}
function updateSimLabel(){let label=document.getElementById("dayLabel");if(label)label.textContent=state.simDay+1}
function renderSim(){updateSimLabel()}
function toggleSim(){if(!state.sim)loadDemo();state.simPlaying=!state.simPlaying;render();if(state.simPlaying){let timer=setInterval(()=>{if(!state.simPlaying){clearInterval(timer);return}state.simDay=Math.min(179,state.simDay+1);if(state.simDay===179)state.simPlaying=false;if(state.activeTab==="Mission"){updateSimLabel();let status=document.querySelector(".sim-status");if(status)status.textContent=`SYNTHETIC SCENARIO · Mission day ${state.simDay+1} of 180`}else render()},Math.max(1000,12000/state.simSpeed))}}
function inject(e){let t=simTime(),r=latest("hr",t),v={...(r?r.values:simValues(state.simDay))};if(e==="radiation")v.radiation=(v.radiation||0)+260;if(e==="fever")v.temp=38.6;if(e==="sleep")v.sleep=2.5;if(e==="glucose")v.glucose=215;record(v,t,"injected event");render();toast("Event injected; alerts recalculated.")}
function resetDemo(){state.simPlaying=false;state.sim=false;state.records=state.records.filter(r=>r.source!=="simulator"&&r.source!=="injected event");state.missionStart=now()-42*864e5;state.simDay=42;state.mode="iss";save();render();toast("Simulator reset; manual data retained.")}
function enterOwn(){state.simPlaying=false;state.sim=false;state.mode="iss";state.missionStart=now();state.records=state.records.filter(r=>r.source!=="simulator"&&r.source!=="injected event");save();go("Check-in");toast("Manual data mode.")}
function onboarding(){let s=[["Mission Health Briefing","Observe your own health signal. ORBITAL records trends and prompts mission-protocol next steps; it does not diagnose or replace crew medical support."],["Spaceflight context","Indicators are associated with HRP hazard categories. Thresholds, risk scores, and forecasts are demonstration settings—not flight rules."],["Local-first operations","Data remains in this browser profile. For urgent symptoms or safety concerns, notify crew and follow mission procedures without waiting for ground support."]],icons=["◎","◇","⌂"],i=state.onboardStep||0;showModal(`<div class="row"><div><div class="eyebrow">Mission Health Briefing · ${i+1} of 3</div><h2>${s[i][0]}</h2></div><div class="brief-icon" aria-hidden="true">${icons[i]}</div></div><p>${s[i][1]}</p><div class="brief-dots" aria-label="Briefing step ${i+1} of 3">${s.map((_,n)=>`<i class="${i===n?"selected":""}"></i>`).join("")}</div><p class="fine muted">${esc(CONFIG.app.disclaimer)}</p><div class="row"><button class="tertiary" onclick="skipOnboarding()">Skip briefing</button><div class="wrap"><button ${i===0?"disabled":""} onclick="state.onboardStep--;onboarding()">Back</button><button class="primary" onclick="if(state.onboardStep<2){state.onboardStep++;onboarding()}else{state.onboarded=true;save();closeModal();render()}">${i===2?"Begin monitoring":"Continue"}</button></div></div>`)}
function skipOnboarding(){state.onboarded=true;save();closeModal();render()}
function selfTest(){let old=state,oldSave=save;try{save=()=>{};state={...defaults(),records:[],missionStart:now()-10*864e5};record({hr:70,temp:36.7},now()-864e5);console.assert(classify("hr",70).level==="green","Typical HR expected green");console.assert(classify("temp",38.6).level==="yellow","Demo high temperature caution expected");console.assert(classify("spo2",88).level==="red","Low oxygen demo critical expected");record({mood:1,sleep:2},now());console.assert(alerts().some(x=>x.key==="mood"&&x.level==="red"),"Low mood expected sensitive alert");console.info("ORBITAL self-test complete (4 assertions).")}finally{state=old;save=oldSave}}
load();render();if(!state.onboarded){state.onboardStep=0;onboarding()}window.orbitalSelfTest=selfTest;window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
</script>
</body>
